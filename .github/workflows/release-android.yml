name: Release packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      scope:
        description: Build all packages or desktop packages only
        required: true
        default: all
        type: choice
        options:
          - all
          - desktop
      release_tag:
        description: Optional existing release tag to append assets to
        required: false
        type: string

permissions:
  contents: write
  # 汇总 job 要跨 job 取回各平台的构建产物。
  actions: read

jobs:
  android:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'all'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.4
          cache: true

      - name: Set up Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.HMUSIC_ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.HMUSIC_ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.HMUSIC_ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.HMUSIC_ANDROID_KEY_ALIAS }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_STORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/android/upload-keystore.jks"
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=$GITHUB_WORKSPACE/android/upload-keystore.jks
          EOF

      - name: Build APK and AAB
        env:
          HMUSIC_REQUIRE_RELEASE_SIGNING: "true"
        run: bash tool/build_release.sh android

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hmusic-android
          path: |
            dist/*-android*.apk
            dist/*-android*.aab
          if-no-files-found: error

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          files: |
            dist/*-android*.apk
            dist/*-android*.aab

  ios-unsigned:
    needs: android
    if: needs.android.result == 'success'
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.4
          cache: true

      - name: Build unsigned IPA
        run: bash tool/build_release.sh ios-unsigned

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hmusic-ios-unsigned
          path: dist/*-ios-unsigned.ipa
          if-no-files-found: error

      - name: Append IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          files: dist/*-ios-unsigned.ipa

  macos:
    needs: android
    if: always() && (needs.android.result == 'success' || needs.android.result == 'skipped')
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.4
          cache: true

      - name: Build macOS universal app
        run: bash tool/build_release.sh macos-adhoc

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hmusic-macos
          path: dist/*-macos-universal.dmg
          if-no-files-found: error

      - name: Append macOS package to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          files: dist/*-macos-universal.dmg

  windows:
    needs: android
    if: always() && (needs.android.result == 'success' || needs.android.result == 'skipped')
    # Flutter 3.35.x 仍探测 VS 2019/v142；windows-2022 的 VS2022 镜像提供 v142 兼容组件。
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.4
          cache: true

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build Windows x64 app
        shell: pwsh
        run: ./tool/build_windows_release.ps1

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hmusic-windows
          path: |
            dist/*-windows-x64.zip
            dist/*-windows-x64-setup.exe
          if-no-files-found: error

      - name: Append Windows package to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          files: |
            dist/*-windows-x64.zip
            dist/*-windows-x64-setup.exe

  linux:
    needs: android
    if: always() && (needs.android.result == 'success' || needs.android.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.4
          cache: true

      - name: Build Linux x64 app
        run: bash tool/build_release.sh linux

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hmusic-linux
          path: dist/*-linux-x64.tar.gz
          if-no-files-found: error

      - name: Append Linux package to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          files: dist/*-linux-x64.tar.gz

  # 各平台的包由各自的 job 直接追加到 Release，校验值只在这里汇总成一个文件——
  # 五个 job 各写一份同名 SHA256SUMS 会互相覆盖，只有汇总 job 能看到全部产物。
  checksums:
    needs: [android, ios-unsigned, macos, windows, linux]
    # always()：某个平台失败时其余平台的包已经上了 Release，校验文件必须覆盖到它们，
    # 不能因为一个 job 红了就整版没有校验值。
    if: always() && (startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '')
    runs-on: ubuntu-latest
    steps:
      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          path: packages
          pattern: hmusic-*
          merge-multiple: true

      - name: Build combined SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          # 这个 job 没有 checkout，gh 只认 GH_REPO，不会去读 GITHUB_REPOSITORY。
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          SUMS="hmusic-${VERSION}-SHA256SUMS.txt"
          cd packages
          ls -l
          find . -maxdepth 1 -type f -name "hmusic-${VERSION}-*" \
            ! -name '*-SHA256SUMS.txt' -printf '%f\n' | LC_ALL=C sort > names.txt
          [ -s names.txt ] || { echo "没有下载到 hmusic-${VERSION}-* 产物，tag 与 pubspec 版本不一致？" >&2; exit 1; }
          : > fresh.txt
          while IFS= read -r name; do sha256sum "$name" >> fresh.txt; done < names.txt
          # scope=desktop / release_tag 这类局部重跑只带部分平台的包，Release 上已有的
          # 校验文件里还留着其余平台的行：先拉下来，让本次的行覆盖同名项、其余行保留，
          # 否则补传一个平台会把另外几个平台的校验值抹掉。
          mkdir -p old
          gh release download "$TAG" --pattern "$SUMS" --dir old --clobber || true
          if [ -f "old/$SUMS" ]; then
            awk 'NR==FNR {seen[$0]; next} !($NF in seen)' names.txt "old/$SUMS" >> fresh.txt
          fi
          LC_ALL=C sort -k 2 fresh.txt > "$SUMS"
          rm -rf old names.txt fresh.txt
          cat "$SUMS"

      - name: Append checksums to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          files: packages/hmusic-*-SHA256SUMS.txt
