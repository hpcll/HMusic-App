name: Release packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      scope:
        description: Build all packages or desktop packages only
        required: true
        default: all
        type: choice
        options:
          - all
          - desktop
      release_tag:
        description: Optional existing release tag to append assets to
        required: false
        type: string

permissions:
  contents: write

jobs:
  android:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'all'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.4
          cache: true

      - name: Set up Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.HMUSIC_ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.HMUSIC_ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.HMUSIC_ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.HMUSIC_ANDROID_KEY_ALIAS }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_STORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/android/upload-keystore.jks"
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=$GITHUB_WORKSPACE/android/upload-keystore.jks
          EOF

      - name: Build APK and AAB
        env:
          HMUSIC_REQUIRE_RELEASE_SIGNING: "true"
        run: bash tool/build_release.sh android

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hmusic-android
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          files: dist/*

  ios-unsigned:
    needs: android
    if: needs.android.result == 'success'
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.4
          cache: true

      - name: Build unsigned IPA
        run: bash tool/build_release.sh ios-unsigned

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hmusic-ios-unsigned
          path: |
            dist/*-ios-unsigned.ipa
            dist/*-ios-unsigned.ipa.sha256
          if-no-files-found: error

      - name: Append IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          files: |
            dist/*-ios-unsigned.ipa
            dist/*-ios-unsigned.ipa.sha256

  macos:
    needs: android
    if: always() && (needs.android.result == 'success' || needs.android.result == 'skipped')
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.4
          cache: true

      - name: Build macOS universal app
        run: bash tool/build_release.sh macos-adhoc

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hmusic-macos
          path: |
            dist/*-macos-universal-adhoc.zip
            dist/*-macos-universal-adhoc.zip.sha256
          if-no-files-found: error

      - name: Append macOS package to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          files: |
            dist/*-macos-universal-adhoc.zip
            dist/*-macos-universal-adhoc.zip.sha256

  windows:
    needs: android
    if: always() && (needs.android.result == 'success' || needs.android.result == 'skipped')
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.4
          cache: true

      - name: Build Windows x64 app
        shell: pwsh
        run: ./tool/build_windows_release.ps1

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hmusic-windows
          path: |
            dist/*-windows-x64.zip
            dist/*-windows-x64.zip.sha256
          if-no-files-found: error

      - name: Append Windows package to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          files: |
            dist/*-windows-x64.zip
            dist/*-windows-x64.zip.sha256

  linux:
    needs: android
    if: always() && (needs.android.result == 'success' || needs.android.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.4
          cache: true

      - name: Build Linux x64 app
        run: bash tool/build_release.sh linux

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hmusic-linux
          path: |
            dist/*-linux-x64.tar.gz
            dist/*-linux-x64.tar.gz.sha256
          if-no-files-found: error

      - name: Append Linux package to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          files: |
            dist/*-linux-x64.tar.gz
            dist/*-linux-x64.tar.gz.sha256
